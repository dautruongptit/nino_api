services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nino-api:latest
    ports:
      - "127.0.0.1:${API_PORT:-8410}:${API_PORT:-8410}"
    container_name: nino-api
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SWAGGER_ENABLED:        "false"
      # true: DB prod da co schema toi V22 duoc apply thu cong truoc khi
      # dung Flyway -> baseline de khong chay lai V1-V22 (xem application.yml)
      FLYWAY_BASELINE:        "true"
      DB_URL: "jdbc:mysql://mysql:3306/${DB_NAME:-nino_db}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true"
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      SERVER_PORT: ${API_PORT:-8410}
      # .env dang de REDIS_HOST=localhost:6379 (cho dev) -> trong container phai tro toi service redis
      REDIS_HOST: redis
      REDIS_PORT: "6380"
      SPRING_FLYWAY_REPAIR_ON_MIGRATE: "true"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    restart: unless-stopped
    networks:
      - nino-net
      - shared-db-network
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    container_name: nino-redis
    restart: unless-stopped
    command: redis-server --port 6380 --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    networks:
      nino-net:
        # giu hostname "redis" de REDIS_HOST=redis trong .env van dung
        aliases:
          - redis
networks:
  nino-net:
    name: nino-net
  shared-db-network:
    external: true
